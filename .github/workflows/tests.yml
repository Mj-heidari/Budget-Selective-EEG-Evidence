name: scientific-software-checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[bdf]"
      - run: python -m unittest discover -s tests -v
      - run: hbn-r3 demo --output demo_data/synthetic.csv --n-per-release 32
      - run: hbn-r3 run --features demo_data/synthetic.csv --config configs/smoke.json --output outputs/smoke
      - run: hbn-r3 plot --results outputs/smoke
